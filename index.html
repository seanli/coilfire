.con { position: absolute; left: 0; right: 0; bottom: 0; height: 60%; min-height: 280px; max-height: 100%;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
  padding: 0 var(--safe-r) var(--safe-b) var(--safe-l);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  background: color-mix(in srgb, var(--island) 90%, transparent);
  box-shadow: 0 0 0 1px var(--ground-line), 0 -10px 30px color-mix(in srgb, var(--island) 45%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-family: var(--font-num); font-size: var(--t-xs); line-height: 1.4; color: var(--ink);
  overflow: hidden; animation: con-in var(--dur) var(--ease-out); }
@media (min-width: 720px) {
  .con { left: auto; width: 420px; right: calc(var(--safe-r) + var(--edge)); bottom: calc(var(--safe-b) + var(--edge));
    padding: 0; border-radius: var(--r-sheet) var(--r-sheet) var(--r-card) var(--r-card); }
}
@media (max-height: 500px) and (max-width: 1000px) {
  .con { left: auto; top: 0; width: min(50%, 420px); height: 100%; min-height: 0; border-radius: 0; }
}
@keyframes con-in { from { transform: translateY(16px); opacity: 0; } }

.con-status { display: flex; align-items: center; gap: var(--s-2); padding: 4px 4px 0 14px; color: var(--muted); font-size: 11px; min-width: 0; }
.con-status > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.con-status .grow { flex: 1; text-align: right; }
.con-status b { color: var(--xp); font-weight: 600; }
.con-close { background: transparent; box-shadow: none; color: var(--muted); }
.con-close svg { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

.con-tabs { display: flex; padding: 0 6px; border-bottom: 1px solid var(--ground-line); overflow-x: auto; scrollbar-width: none; }
.con-tab { flex: 1 0 auto; min-height: var(--tap); padding: 0 8px; border: 0; border-bottom: 2px solid transparent; background: none;
  color: var(--muted); font: inherit; cursor: pointer; touch-action: manipulation; }
.con-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.con-body { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch;
  user-select: text; -webkit-user-select: text; min-height: 0; }
.con-list { margin: 0; padding: 6px 0; list-style: none; }
.con-list > li { padding: 4px 14px; }
.con-list > li:nth-child(odd) { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.con-empty { padding: var(--s-4) 14px; color: var(--faint); }

.con-ev { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.con-ev .t, .con-log .t { color: var(--faint); font-variant-numeric: tabular-nums; }
.con-ev .ev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.con-ev .ev i, .con-log i { font-style: normal; color: var(--muted); }
.con-ev .n { color: var(--accent); }
.con-ev .p { color: var(--muted); }
.con-ev pre { grid-column: 2 / -1; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }

.con-log { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 2px 8px; align-items: baseline; }
.con-log .m { overflow-wrap: anywhere; }
.con-log.is-warn .m { color: var(--accent); }
.con-log.is-error .m { color: var(--danger); }
.con-log.has-data { cursor: pointer; }
.con-log pre { grid-column: 2; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }

.con-slice > button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%;
  min-height: var(--tap); padding: 0; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.con-slice > button span:nth-child(2) { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.con-slice > button::after { content: "+"; color: var(--faint); }
.con-slice.is-open > button::after { content: "–"; }
.con-slice pre, .con-out pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.con-slice pre { padding: 0 0 8px; color: var(--xp); }

.con-mod { display: grid; gap: 2px; padding-block: 8px !important; }
.con-mod .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.con-mod .head b { font-weight: 600; }
.con-mod .k { color: var(--muted); }
.con-mod .err { color: var(--danger); overflow-wrap: anywhere; }
.con-badge { display: inline-block; padding: 0 7px; border-radius: var(--r-pill); font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--c, var(--muted)); box-shadow: inset 0 0 0 1px var(--c, var(--muted)); }
.con-badge.is-ok, .con-badge.is-live { --c: var(--xp); }
.con-badge.is-failed { --c: var(--danger); }
.con-badge.is-fallback, .con-badge.is-locked { --c: var(--accent); }
.con-badge.is-mock, .con-badge.is-off { --c: var(--faint); }

.con-cmd { border-top: 1px solid var(--ground-line); padding: 6px 14px 8px; display: grid; gap: 4px; }
.con-out { max-height: 8.5em; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; user-select: text; -webkit-user-select: text; }
.con-out:empty { display: none; }
.con-out .q { color: var(--muted); }
.con-out .q::before { content: "> "; color: var(--accent); }
.con-out .a { color: var(--xp); }
.con-line { display: flex; align-items: center; gap: 6px; }
.con-line::before { content: ">"; color: var(--accent); }
.con-input { flex: 1; min-width: 0; min-height: var(--tap); padding: 0; border: 0; outline: 0; background: none; color: var(--ink);
  font-family: var(--font-num); font-size: var(--t-md); caret-color: var(--accent); user-select: text; -webkit-user-select: text; }
.con-input::placeholder { color: var(--faint); }
.con-hint { color: var(--faint); font-size: 11px; white-space: nowrap; }
